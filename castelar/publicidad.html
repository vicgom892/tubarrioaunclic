<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Monday - [Nombre Localidad]</title>
    <link rel="stylesheet" href="../shared/css/publicidad.css">
</head>
<body>
    <!-- Sección Principal -->
    <section class="seccion-publicidad" id="seccionPublicidad">
        <div class="container">
            <!-- Header Principal -->
            <header class="header-principal">
                <div class="titulo-container">
                    <!-- NUEVO TÍTULO AGREGADO -->
                    <h1 class="titulo-principal">
                        Descubre las Mejores <span class="destacado">Ofertas y Promociones</span>
                    </h1>
                    <div class="fecha-container">
                        <p class="fecha-promo">Del 03 al 09 de Noviembre</p>
                    </div>
                </div>
                
                <!-- Imagen Cyber Monday -->
                <div class="imagen-principal">
                    <img src="../shared/img/icon-192x192.png" alt="Cyber Monday" class="img-cyber">
                </div>
            </header>

            <!-- Categorías de Ofertas -->
            <div class="categorias-container" id="categoriasContainer">
                <!-- Las categorías se cargarán dinámicamente -->
            </div>

            <!-- Footer -->
            <footer class="footer-publicidad">
                <button class="btn-ver-mas" id="btnVerMas">Ver Todas las Ofertas</button>
            </footer>
        </div>
    </section>

    <script src="../shared/js/publicidad.js"></script>
</body>
</html>
